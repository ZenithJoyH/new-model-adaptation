schema_version: 1
id: vllm-plugin-fl
display_name: vLLM + vllm-plugin-FL + FlagGems
profile_version: 7
status: active
platforms: [nvidia, ppu, metax, ascend, mthreads, hygon]

components:
  - role: inference_engine
    name: vllm
    required: true
    mutation_policy: read_only
  - role: platform_adapter
    name: vllm-plugin-FL
    required: true
    mutation_policy: installed_product_code
  - role: kernel_library
    name: FlagGems
    required: true
    mutation_policy: installed_product_code
  - role: vllm_kernel_library
    name: FlagGems-vllm
    required: false
    mutation_policy: installed_product_code

source_policy:
  default: read_only
  writable_roles:
    - platform_adapter
    - kernel_library
    - vllm_kernel_library

execution_modes:
  required:
    - eager
    - graph
  acceptance_primary: graph
  graph_policy:
    preference_order:
      - full
      - full-and-piecewise
      - decode-full
      - piecewise
    minimum: piecewise
    level_checks:
      full:
        - full_graph
      full-and-piecewise:
        - full_and_piecewise_graph
      decode-full:
        - decode_full_graph
      piecewise:
        - piecewise_graph

service:
  protocols:
    - openai-chat
    - openai-completions

acceptance:
  steps:
    execution-mode:
      validator: checks
      checks: [eager, graph, model_inference]
    sanity:
      validator: checks
      checks: [reference_consistency, output_health, performance_sanity]
    accuracy:
      validator: flageval
      checks: [service_identity, dataset_provenance]
    performance:
      validator: vllm-performance
      checks: [service_identity, accuracy_to_performance_transition]
    evidence:
      validator: checks
      checks: [source_review, vllm_unchanged, artifacts_complete]
    summary:
      validator: checks
      checks: [launcher_syntax, launcher_readiness, launcher_minimal, launcher_self_contained, installed_component_imports, normal_cache_restored]
  accuracy_adapter: flageval-openai
  performance_adapter: vllm-bench-serve
  prefix_caching:
    non_performance: enabled
    performance: disabled
    disable_mechanism: --no-enable-prefix-caching

documents:
  workflow: workflow.md
  acceptance: acceptance.md
  detailed_workflow: detailed-workflow.md
  detailed_workflow_zh: detailed-workflow.zh-CN.md
