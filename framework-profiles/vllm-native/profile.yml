schema_version: 1
id: vllm-native
display_name: Native vLLM on NVIDIA
profile_version: 2
status: active
platforms: [nvidia]

components:
  - role: inference_engine
    name: vllm
    required: true
    mutation_policy: editable_product_code
  - role: model_implementation
    name: model configuration, processor and weights
    required: true
    mutation_policy: read_only
  - role: platform_runtime
    name: NVIDIA driver, CUDA and PyTorch
    required: true
    mutation_policy: read_only

source_policy:
  default: read_only
  writable_roles: [inference_engine]

execution_modes:
  required: [eager, graph]
  acceptance_primary: graph
  graph_policy:
    preference_order: [full, full-and-piecewise, decode-full, piecewise]
    minimum: piecewise
    level_checks:
      full: [full_graph]
      full-and-piecewise: [full_and_piecewise_graph]
      decode-full: [decode_full_graph]
      piecewise: [piecewise_graph]

service:
  protocols: [openai-chat, openai-completions]

acceptance:
  steps:
    execution-mode:
      validator: checks
      checks: [eager, graph, model_inference]
    sanity:
      validator: checks
      checks: [ten_concurrent_correct, output_health, performance_sanity]
    accuracy:
      validator: flageval
      checks: [service_identity, dataset_provenance]
    performance:
      validator: vllm-performance
      checks: [service_identity, accuracy_to_performance_transition]
    evidence:
      validator: checks
      checks: [source_review, vllm_revision_and_diff, artifacts_complete]
    summary:
      validator: checks
      checks: [launcher_syntax, launcher_readiness, launcher_minimal, normal_cache_restored]
  accuracy_adapter: flageval-openai
  performance_adapter: vllm-bench-serve
  prefix_caching:
    non_performance: enabled
    performance: disabled
    disable_mechanism: --no-enable-prefix-caching

documents:
  workflow: workflow.md
  acceptance: acceptance.md
