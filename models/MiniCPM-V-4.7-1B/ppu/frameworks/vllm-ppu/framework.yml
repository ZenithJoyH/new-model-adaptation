profile_snapshot:
  schema_version: 1
  id: vllm-ppu
  display_name: T-Head native vLLM on PPU
  profile_version: 2
  status: experimental
  platforms:
  - ppu
  components:
  - role: inference_engine
    name: T-Head vLLM
    required: true
    mutation_policy: installed_product_code
  - role: model_implementation
    name: model configuration, processor and weights
    required: true
    mutation_policy: read_only
  - role: platform_runtime
    name: T-Head driver, SDK, PyTorch and native kernels
    required: true
    mutation_policy: read_only
  source_policy:
    default: read_only
    writable_roles:
    - inference_engine
  execution_modes:
    required:
    - eager
    - graph
    acceptance_primary: graph
    graph_policy:
      preference_order:
      - full
      - full-and-piecewise
      - decode-full
      - piecewise
      minimum: piecewise
      level_checks:
        full:
        - full_graph
        full-and-piecewise:
        - full_and_piecewise_graph
        decode-full:
        - decode_full_graph
        piecewise:
        - piecewise_graph
  service:
    protocols:
    - openai-chat
    - openai-completions
  acceptance:
    steps:
      execution-mode:
        validator: checks
        checks:
        - eager
        - graph
        - model_inference
      sanity:
        validator: checks
        checks:
        - reference_consistency
        - output_health
      evidence:
        validator: checks
        checks:
        - source_review
        - vllm_revision_and_diff
        - artifacts_complete
      summary:
        validator: checks
        checks:
        - launcher_syntax
        - launcher_readiness
        - launcher_minimal
        - normal_cache_restored
        - limitations_recorded
    accuracy_adapter: null
    performance_adapter: null
    prefix_caching:
      non_performance: enabled
      performance: disabled
      disable_mechanism: --no-enable-prefix-caching
  documents:
    workflow: workflow.md
    acceptance: acceptance.md
