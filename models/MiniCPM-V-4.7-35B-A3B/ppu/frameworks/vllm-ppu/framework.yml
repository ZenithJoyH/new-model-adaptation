      summary:
        validator: checks
        checks:
        - launcher_syntax
        - launcher_readiness
        - launcher_minimal
        - normal_cache_restored
        - limitations_recorded
    accuracy_adapter: null
    performance_adapter: null
    prefix_caching:
      non_performance: enabled
      performance: disabled
      disable_mechanism: --no-enable-prefix-caching
  documents:
    workflow: workflow.md
    acceptance: acceptance.md
