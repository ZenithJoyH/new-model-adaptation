    name: T-Head driver, SDK, PyTorch and native kernels
    required: true
    mutation_policy: read_only
  source_policy:
    default: read_only
    writable_roles:
    - inference_engine
  execution_modes:
    required:
    - eager
    - graph
    acceptance_primary: graph
    graph_policy:
      preference_order:
      - full
      - full-and-piecewise
      - decode-full
      - piecewise
      minimum: piecewise
      level_checks:
        full:
        - full_graph
        full-and-piecewise:
        - full_and_piecewise_graph
        decode-full:
        - decode_full_graph
        piecewise:
        - piecewise_graph
  service:
    protocols:
    - openai-chat
    - openai-completions
  acceptance:
    steps:
      execution-mode:
        validator: checks
        checks:
        - eager
        - graph
        - model_inference
      sanity:
        validator: checks
        checks:
        - reference_consistency
        - output_health
      evidence:
