schema_version: 1
model: ""
platform: ""
configuration_status: draft

target:
  hosts: []
  container_name: ""
  container_image: ""

# User-assigned roots, one per exact target host; never infer or auto-create them.
# host_root and container_root must be canonical absolute POSIX directories.
# Verify real paths, ownership and the existing container mount mapping on site.
# This declaration is not a chroot and does not authorize writes outside it.
workspace:
  roots: []  # [{host_alias: PPU-01, host_root: /assigned/task, container_root: /mounted/task}]

boundaries:
  vllm_source_read_only: true
  adaptation_container_must_remain_running: true

stack:
  vllm:
    path: ""
    revision: ""
  plugin:
    path: ""
    revision: ""
  flaggems:
    path: ""
    revision: ""

service:
  model_path: ""
  served_model_name: ""
  port: null
  tensor_parallel_size: null
  gpu_memory_utilization: 0.9
  max_model_len:
    model_supported: null
    initial: null
    evidence: ""
  prefix_caching:
    default_enabled: true
    performance:
      enabled: null
      launch_args:
        - --no-enable-prefix-caching
      verification: ""

execution_modes:
  eager:
    enabled: true
    extra_args: []
  graph:
    enabled: true
    extra_args: []

acceptance:
  graph_base_url: ""
  sanity_concurrency: 10
  accuracy_image: ""
  accuracy_runner: test/Accuracy_test/llmrun.py
  accuracy_config: ""
  performance_directory: test/perf_test
  communication_directory: test/nccl_test
