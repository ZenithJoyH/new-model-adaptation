---
- name: Validate asynchronous job query inputs
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Require one explicit host and job ID
      ansible.builtin.assert:
        that:
          - target | default('') | length > 0
          - target | default('') not in ['all', 'ppu', '*']
          - target | default('') in groups['modelscope_hosts']
          - ansible_job_id | default('') | length > 0
          - model_local_dir | default('') | length > 1
          - model_local_dir | default('') is match('^/')
        fail_msg: >-
          Pass -e target=PPU-01 -e ansible_job_id=<job-id>
          -e model_local_dir=/absolute/model/path.

- name: Check one asynchronous Ansible job
  hosts: "{{ target | default('none') }}"
  gather_facts: false

  tasks:
    - name: Read asynchronous job status
      ansible.builtin.async_status:
        jid: "{{ ansible_job_id }}"
      register: job_status
      failed_when: false

    - name: Check downloaded model metadata after completion
      ansible.builtin.stat:
        path: "{{ model_local_dir }}/config.json"
      register: model_config
      when:
        - job_status.finished | default(false) | bool
        - job_status.rc | default(1) | int == 0

    - name: Read downloaded model directory size after completion
      ansible.builtin.command:
        argv:
          - du
          - -sh
          - "{{ model_local_dir }}"
      register: model_size
      changed_when: false
      when:
        - job_status.finished | default(false) | bool
        - job_status.rc | default(1) | int == 0
        - model_config.stat.exists | default(false)

    - name: Verify a completed download
      ansible.builtin.assert:
        that:
          - job_status.rc | default(1) | int == 0
          - model_config.stat.exists | default(false)
        fail_msg: >-
          The job finished but did not complete successfully or config.json is
          missing. Inspect the job result above before restarting it.
      when: job_status.finished | default(false) | bool

    - name: Report asynchronous job status
      ansible.builtin.debug:
        msg:
          - "finished={{ job_status.finished | default(false) }}"
          - "started={{ job_status.started | default(false) }}"
          - "return_code={{ job_status.rc | default('not available') }}"
          - "model_size={{ model_size.stdout | default('not available') }}"
          - "stdout={{ job_status.stdout | default('') }}"
          - "stderr={{ job_status.stderr | default(job_status.msg | default('')) }}"
