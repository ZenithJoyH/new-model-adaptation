---
- name: Install and expose the ModelScope CLI
  hosts: modelscope_hosts
  serial: 1
  gather_facts: false

  pre_tasks:
    - name: Check the configured Python interpreter
      ansible.builtin.stat:
        path: "{{ ansible_python_interpreter }}"
      register: python_binary

    - name: Check the configured pip executable
      ansible.builtin.stat:
        path: "{{ modelscope_pip_executable }}"
      register: pip_binary

    - name: Require the configured Python and pip
      ansible.builtin.assert:
        that:
          - python_binary.stat.exists
          - python_binary.stat.executable
          - pip_binary.stat.exists
          - pip_binary.stat.executable
        fail_msg: >-
          Expected Python at {{ ansible_python_interpreter }} and pip at
          {{ modelscope_pip_executable }}.

  tasks:
    - name: Install the pinned ModelScope version
      ansible.builtin.pip:
        name: "modelscope=={{ modelscope_version }}"
        executable: "{{ modelscope_pip_executable }}"
        state: present

    - name: Check generated CLI entry points
      ansible.builtin.stat:
        path: "{{ item.value }}"
      loop: "{{ modelscope_cli_links | dict2items }}"
      register: cli_sources
      loop_control:
        label: "{{ item.key }}"

    - name: Require generated CLI entry points
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.executable
        fail_msg: "Missing executable {{ item.item.value }} after installation."
      loop: "{{ cli_sources.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Expose CLI commands through usr-local-bin
      ansible.builtin.file:
        src: "{{ item.value }}"
        dest: "/usr/local/bin/{{ item.key }}"
        state: link
        force: false
      loop: "{{ modelscope_cli_links | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Verify the installed package version
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - -c
          - >-
            import modelscope;
            assert modelscope.__version__ == "{{ modelscope_version }}";
            print(modelscope.__version__)
      register: installed_version
      changed_when: false

    - name: Verify the download CLI
      ansible.builtin.command:
        argv:
          - /usr/local/bin/modelscope
          - download
          - --help
      changed_when: false

    - name: Report installed version
      ansible.builtin.debug:
        msg: "ModelScope {{ installed_version.stdout }} is ready on {{ inventory_hostname }}."
      when: not ansible_check_mode

    - name: Report check-mode result
      ansible.builtin.debug:
        msg: "Check mode completed on {{ inventory_hostname }}; no changes were predicted."
      when: ansible_check_mode
