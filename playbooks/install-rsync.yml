---
- name: Install rsync on selected transfer hosts
  hosts: rsync_transfer_hosts
  serial: 1
  gather_facts: true

  pre_tasks:
    - name: Require root access for package installation
      ansible.builtin.assert:
        that:
          - ansible_facts.user_id == "root"
        fail_msg: "Package installation requires root access on {{ inventory_hostname }}."

  tasks:
    - name: Install rsync on Debian-family systems
      ansible.builtin.apt:
        name: rsync
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts.os_family == "Debian"

    - name: Install rsync on Red Hat-family systems
      ansible.builtin.dnf:
        name: rsync
        state: present
      when: ansible_facts.os_family == "RedHat"

    - name: Require a supported operating-system family
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family in ["Debian", "RedHat"]
        fail_msg: >-
          Unsupported operating-system family {{ ansible_facts.os_family }} on
          {{ inventory_hostname }}.

    - name: Verify rsync is available
      ansible.builtin.command:
        argv:
          - rsync
          - --version
      register: rsync_version
      changed_when: false
      when: not ansible_check_mode

    - name: Report installed rsync version
      ansible.builtin.debug:
        msg: "{{ rsync_version.stdout_lines[0] }} is ready on {{ inventory_hostname }}."
      when: not ansible_check_mode

    - name: Report check-mode result
      ansible.builtin.debug:
        msg: >-
          Check mode completed on {{ inventory_hostname }}; review the predicted
          package change before installation.
      when: ansible_check_mode
